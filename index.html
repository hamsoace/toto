
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Toto Care</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Lexend', 'sans-serif'],
            },
            colors: {
              'totocare-blue': '#47a9eb',
              'totocare-blue-light': '#e3f2fd',
              'mom-pink': '#FF9EB5',
              'dad-blue': '#47a9eb', // dad-blue is same as totocare-blue
              'success': '#4CAF50',

              'danger': '#f44336',
              'text-primary': '#111518',
              'text-secondary': '#637988',
              'background': '#f7f9fc',
              'dark-mode': '#121212',
            }
          }
        }
      }
